name: CI

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
          path: 'my_bucket'
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The manifest test harness lives in Scoop itself. Do not use the
          # archived Ash258/Scoop-Core fork here: its Pester-4 era test files
          # cannot run under Pester 5+, so the job died in a BeforeAll block
          # and never validated a single manifest.
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Install test dependencies
        run: |
          $required = @(
            @{ Name = 'BuildHelpers'; Version = '2.0.1' }
            @{ Name = 'Pester'; Version = '5.2.0' }
          )
          foreach ($module in $required) {
            $have = Get-Module -ListAvailable -Name $module.Name |
              Where-Object { $_.Version -ge [version] $module.Version } |
              Select-Object -First 1
            if ($have) {
              Write-Host "$($module.Name) $($have.Version) is already available"
              continue
            }
            # PowerShell 7.4+ ships PSResourceGet, which needs no NuGet provider.
            # Windows PowerShell 5.1 falls back to PowerShellGet v2 - for that
            # path the PSGallery repository has to exist, or Install-Module dies
            # with 'There is no repository, use Register-PSRepository to register
            # at least one.'
            if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
              Install-PSResource -Name $module.Name -Version "[$($module.Version),)" -Scope CurrentUser -TrustRepository
            } else {
              if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                Register-PSRepository -Default
              }
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
              Install-Module -Name $module.Name -MinimumVersion $module.Version -Force -AllowClobber -Scope CurrentUser -SkipPublisherCheck
            }
          }
          Get-Module -ListAvailable Pester, BuildHelpers | Select-Object Name, Version, Path | Format-Table -AutoSize
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1
